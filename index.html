<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f35"><meta name="description" content="แอป Fit กับฉัน 30 วัน บันทึกน้ำหนัก เมนูอาหาร และโปรแกรมฟิตเนต">
<link rel="manifest" href="manifest.json">
<title>Fit กับฉัน | 30 วัน</title>
<style>
:root{--green:#173f35;--green2:#285448;--mint:#b9f3ce;--bg:#f4f7f4;--card:#fff;--text:#1e2923;--muted:#68756d;--line:#dfe7e1;--accent:#39936d;--blue:#4399d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:var(--green);color:#fff;font-weight:650;cursor:pointer}button.secondary{background:#edf2ee;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.4}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:84px}.hero{background:var(--green);color:white;padding:22px 18px 18px;border-radius:0 0 24px 24px}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:1px}.hero h1{margin:5px 0;font-size:27px}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#d6eadf}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:var(--green2);padding:12px;border-radius:14px}.stat small{display:block;color:#d6eadf;font-size:11px}.stat strong{display:block;font-size:21px;margin-top:3px}.progress{height:7px;border-radius:9px;background:#496b5f;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--mint);width:0}.tabs{display:flex;gap:5px;overflow:auto;padding:12px 12px 4px;position:sticky;top:0;background:var(--bg);z-index:3}.tabs button{flex:1;white-space:nowrap;padding:10px 12px;background:#e7eee8;color:#314139;font-size:13px}.tabs button.active{background:var(--green);color:white}.content{padding:12px;display:grid;gap:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.panel h2{font-size:18px;margin:0 0 10px}.panel h3{font-size:15px;margin:0 0 8px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.field{display:grid;gap:5px;flex:1;min-width:0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--text)}.full{width:100%;margin-top:10px}.small{font-size:12px;color:var(--muted)}.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf1ed}.check:last-child{border:0}.check input{width:19px;height:19px;accent-color:var(--accent)}.badge{display:inline-block;background:#e0f2e7;color:#23613e;border-radius:30px;padding:5px 9px;font-size:12px}.menuitem,.dayitem{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:9px;cursor:pointer}.menuitem.selected,.dayitem.selected{border-color:var(--accent);background:#eff8f1}.menuitem p{margin:6px 0;font-size:13px}.pillrow{display:flex;gap:8px}.pillrow button{flex:1}.pillrow button.selected{outline:2px solid var(--accent);background:var(--green2)}.bar{height:8px;background:#e6ece7;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:4}.bottom button{max-width:536px;width:100%}.notice{background:#f7f2e5;border:1px solid #eee1b8;border-radius:12px;padding:12px;font-size:12px;color:#67562b}.success{color:#267447;font-size:13px}.chart{width:100%;height:auto}.hidden{display:none!important}.daygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.daygrid button{padding:10px 0;background:#e8eee9;color:#314139}.daygrid button.done{background:#d5efdd;color:#267447}.daygrid button.chosen{outline:2px solid var(--accent)}.listrow{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.listrow:last-child{border:0}@media(min-width:560px){.hero{margin-top:12px;border-radius:24px}.app{padding-top:1px}}
</style></head>
<body><main class="app">
<header class="hero">
 <div class="eyebrow">MY FIT · 30 DAY JOURNEY</div><h1>Fit กับฉัน 🌱</h1><div class="muted">เริ่มทีละนิด แข็งแรงขึ้นทุกวัน</div>
 <div class="stats"><div class="stat"><small>น้ำหนักล่าสุด</small><strong id="heroWeight">65 <small style="display:inline">กก.</small></strong></div><div class="stat"><small>เป้าหมาย</small><strong>55 <small style="display:inline">กก.</small></strong></div><div class="stat"><small>ภารกิจสำเร็จ</small><strong id="heroDays">0/30</strong></div></div>
 <div class="row between" style="margin-top:13px"><small>ความคืบหน้าสู่เป้าหมายระยะยาว</small><small id="progressText">0%</small></div><div class="progress"><span id="progressBar"></span></div>
</header>
<nav class="tabs" id="tabs"><button class="active" data-tab="today">วันนี้</button><button data-tab="food">อาหาร</button><button data-tab="exercise">ฟิตเนต 30 วัน</button><button data-tab="stats">สถิติ</button><button data-tab="challenge">30 วัน</button></nav>
<section class="content" id="view"></section>
<div class="bottom"><button id="exportBtn" class="secondary">สำรองข้อมูล / ส่งออก</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const defaultState={day:1,weight:65,waist:80,water:0,checks:[false,false,false,false],exercise:"เดินเร็ว",minutes:20,exerciseDone:false,doneDays:[],mealMode:"ประหยัด",mealChoice:"ข้าวกะเพราไก่",logs:[{day:1,weight:65,waist:80}],notes:"",gymLogs:{}};
let state; try{state={...structuredClone(defaultState),...(JSON.parse(localStorage.getItem("fitMe30")||"null")||{})};state.gymLogs=state.gymLogs||{}}catch(e){state={...defaultState,gymLogs:{}}}
let tab="today";
const tasks=[["เริ่มต้นอย่างอ่อนโยน","บันทึกน้ำหนักและดื่มน้ำให้เพียงพอ"],["จัดจานให้สมดุล","กินโปรตีนทุกมื้อและเพิ่มผักหรือผลไม้"],["ขยับร่างกาย","เดินตามกำลัง 10–20 นาที"],["ลดเครื่องดื่มหวาน","เลือกน้ำเปล่าแทนน้ำหวานหนึ่งครั้ง"],["พักผ่อนให้พอ","จัดเวลานอนให้เหมาะกับตารางชีวิต"],["ฝึกกล้ามเนื้อเบา ๆ","ฝึกท่าพื้นฐานตามความพร้อมของร่างกาย"],["ทบทวนสัปดาห์","สรุปสิ่งที่ทำได้โดยไม่ตัดสินตัวเอง"]];
const menus={"ประหยัด":[["ข้าวกะเพราไก่","ขอข้าวพอดี ไก่ไม่ติดหนัง เพิ่มไข่ได้","ประมาณ 450–600 kcal"],["ข้าวไข่เจียว","ใช้น้ำมันน้อย เพิ่มเนื้อสัตว์หรือเต้าหู้","ประมาณ 350–550 kcal"],["ข้าวไก่ย่าง","เลือกไก่ย่างไม่ติดหนังกับข้าวและผลไม้","ประมาณ 400–550 kcal"]],"ทำง่าย":[["ไข่ต้มกับขนมปัง","เพิ่มนมหรือโยเกิร์ตรสธรรมชาติ","ประมาณ 300–450 kcal"],["ข้าวอกไก่","กินคู่กับผักที่ชอบหรือผลไม้","ประมาณ 400–550 kcal"],["โยเกิร์ตและผลไม้","เลือกโยเกิร์ตรสธรรมชาติ เติมไข่ต้มถ้าหิว","ประมาณ 250–400 kcal"]]};
function save(){localStorage.setItem("fitMe30",JSON.stringify(state));renderHeader()}
function renderHeader(){let w=Number(state.logs.at(-1)?.weight??65);$("heroWeight").innerHTML=`${w} <small style="display:inline">กก.</small>`;$("heroDays").textContent=`${state.doneDays.length}/30`;let p=Math.max(0,Math.min(100,(65-w)/10*100));$("progressText").textContent=Math.round(p)+"%";$("progressBar").style.width=p+"%"}
function checkedList(items,vals,change){return items.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${vals[i]?"checked":""}><span>${x}</span></label>`).join("")}
function panel(title,body){return `<article class="panel"><h2>${title}</h2>${body}</article>`}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let html="";
if(tab==="today"){let task=tasks[(state.day-1)%tasks.length];html+=`<div><h2 style="margin:0 0 4px">สวัสดี วันนี้วันที่ ${state.day} 🌱</h2><div class="muted">ทำเท่าที่ไหว ไม่ต้องสมบูรณ์แบบทุกวัน</div></div>`;
html+=panel("บันทึกน้ำหนักวันนี้",`<div class="row"><div class="field"><label>น้ำหนัก (กก.)</label><input id="weight" type="number" min="20" max="300" step=".1" value="${state.weight}"></div><div class="field"><label>รอบเอว (ซม.)</label><input id="waist" type="number" min="20" max="300" step=".5" value="${state.waist}"></div></div><button class="full" id="saveWeight">บันทึกน้ำหนักและรอบเอว</button><div class="small" id="saveMessage" style="margin-top:8px"></div>`);
html+=panel(`ภารกิจวันนี้ <span class="badge">วันที่ ${state.day}/30</span>`,`<h3>${task[0]}</h3><div>${task[1]}</div><button class="full" id="completeTask">${state.doneDays.includes(state.day)?"ยกเลิกการทำภารกิจ":"ทำภารกิจสำเร็จ ✓"}</button>`);
html+=panel(`ดื่มน้ำ · ${state.water} แก้ว`,`<div class="bar"><span style="width:${Math.min(100,state.water/8*100)}%"></span></div><div class="row" style="margin-top:10px"><button class="secondary" id="waterMinus" ${state.water===0?"disabled":""}>− ลด 1 แก้ว</button><button id="waterPlus">+ เพิ่ม 1 แก้ว</button></div><div class="small" style="margin-top:8px">แก้วละประมาณ 250 มล. ปรับตามความกระหาย อากาศ และข้อจำกัดสุขภาพ</div>`);
html+=panel("เช็กอินพฤติกรรม",checkedList(["กินอาหารครบและอิ่มพอดี","มีโปรตีนในมื้ออาหาร","ขยับร่างกายตามกำลัง","พักผ่อนเพียงพอ"],state.checks)+`<div class="small">ทำได้ ${state.checks.filter(Boolean).length}/4 ข้อ</div>`);
html+=panel("เลือกวันของโปรแกรม",`<div class="row"><button class="secondary" id="prevDay" ${state.day===1?"disabled":""}>‹ วันก่อน</button><div style="flex:1;text-align:center;font-weight:700">วันที่ ${state.day}</div><button class="secondary" id="nextDay" ${state.day===30?"disabled":""}>วันถัดไป ›</button></div>`);
}else if(tab==="food"){html+=panel("เมนูอาหารครบ 30 วัน",`<div class="muted">ดูเมนูรายวันพร้อมวัตถุดิบ วิธีทำ และแคลอรีโดยประมาณ</div><button class="full" id="openMealPlan">เปิดเมนูอาหาร 30 วัน</button>`);html+=`<div><h2 style="margin:0 0 4px">กินอร่อย ไม่อดอาหาร 🍱</h2><div class="muted">เลือกเมนูตามงบและสิ่งที่มี</div></div>`;html+=panel("รูปแบบเมนู",`<div class="pillrow">${["ประหยัด","ทำง่าย"].map(x=>`<button data-mode="${x}" class="${state.mealMode===x?"selected":""}">${x}</button>`).join("")}</div>`);html+=panel("เลือกเมนู",menus[state.mealMode].map(m=>`<div class="menuitem ${state.mealChoice===m[0]?"selected":""}" data-meal="${m[0]}"><b>${m[0]}</b><p>${m[1]}</p><span class="small">${m[2]}</span></div>`).join(""));html+=panel("แนวทางจัดจาน",`<div class="row"><div style="flex:1;background:#e0efdf;border-radius:12px;padding:12px;text-align:center"><b>½ จาน</b><div class="small">ผัก/ผลไม้</div></div><div style="flex:1;background:#f4e3c6;border-radius:12px;padding:12px;text-align:center"><b>¼ จาน</b><div class="small">โปรตีน</div></div><div style="flex:1;background:#e0e8fa;border-radius:12px;padding:12px;text-align:center"><b>¼ จาน</b><div class="small">ข้าว/แป้ง</div></div></div><p class="small">พลังงานเป็นค่าประมาณ ขึ้นกับปริมาณและวิธีปรุง เริ่มจากอาหารที่ชอบและปรับทีละอย่าง</p>`)}
else if(tab==="exercise"){
const plan=gymSessionForDay(state.day);
const log=state.gymLogs[String(state.day)]||{done:false,items:{},notes:""};
html+=`<div><h2 style="margin:0 0 4px">ฟิตเนต 30 วัน 💪</h2><div class="muted">ลดไขมันและกระชับทั้งตัว · 3 วัน/สัปดาห์ · 45 นาที/ครั้ง</div></div>`;
html+=panel("ตาราง 30 วัน",`<div class="daygrid">${Array.from({length:30},(_,i)=>i+1).map(d=>{let p=gymSessionForDay(d),l=state.gymLogs[String(d)]||{};return `<button data-gymday="${d}" class="${state.day===d?"chosen":""} ${l.done?"done":""}" title="${p?("วันฝึก: "+p.title):"วันพัก/เดินเบา ๆ"}">${l.done?"✓":d}</button>`}).join("")}</div><div class="small" style="margin-top:8px">วงกลมสีเขียว = ฝึกเสร็จ · เลือกวันที่เพื่อดูโปรแกรมวันนั้น</div>`);
if(plan){
html+=panel(`วันที่ ${state.day}/30 · ${plan.title}`,`<div class="badge">วันฝึก ${plan.sessionNo} จาก 12</div><p class="small">เวลารวมประมาณ 45 นาที: วอร์มอัป 5 นาที · ฝึกเครื่อง 30–32 นาที · คูลดาวน์ 5–10 นาที</p><div class="notice">เลือกน้ำหนักที่ทำได้ด้วยท่าถูกต้อง เหลือแรงอีกประมาณ 2–3 ครั้ง ไม่ต้องฝืนจนหมดแรง หากเจ็บแปลบ เวียนหัว หรือหายใจผิดปกติ ให้หยุด</div>`);
html+=panel("ท่าฝึกและบันทึก",plan.exercises.map((ex,i)=>{let v=log.items[i]||{};return `<div class="menuitem" style="cursor:default"><div class="row between"><b>${i+1}. ${ex.name}</b><span class="badge">${ex.time}</span></div><p>${ex.how}</p><div class="row"><div class="field"><label>น้ำหนักที่ใช้ (กก. ถ้ามี)</label><input type="number" min="0" step="1" placeholder="เช่น 10" data-gymweight="${i}" value="${v.weight??""}"></div><div class="field"><label>ทำได้กี่ครั้ง/เซต</label><input type="text" placeholder="${ex.reps}" data-gymreps="${i}" value="${v.reps??""}"></div></div><div class="small" style="margin-top:6px">เป้าหมาย: ${ex.reps} · พัก ${ex.rest}</div><label class="check"><input type="checkbox" data-gymcheck="${i}" ${v.done?"checked":""}><span>ทำท่านี้เสร็จแล้ว</span></label></div>`}).join("")+`<div class="field" style="margin-top:10px"><label>บันทึกความรู้สึก / น้ำหนักที่อยากลองครั้งหน้า</label><textarea id="gymNotes" rows="2" placeholder="เช่น ท่าสุดท้ายเริ่มหนัก แต่ยังควบคุมท่าได้">${log.notes||""}</textarea></div><label class="check"><input type="checkbox" id="gymDone" ${log.done?"checked":""}><span><b>ทำโปรแกรมวันนี้ครบแล้ว</b></span></label><button class="full" id="saveGym">บันทึกการฝึกวันนี้</button><div class="small" id="gymSavedMsg" style="margin-top:8px"></div>`);
}else{
html+=panel(`วันที่ ${state.day}/30 · วันพักฟื้น`, `<div class="badge">พักหรือเคลื่อนไหวเบา ๆ</div><p>วันนี้ไม่มีเวทตามตาราง ให้พักกล้ามเนื้อ หรือเดินสบาย ๆ 10–20 นาทีและยืดเหยียดเบา ๆ หากรู้สึกเหนื่อยให้พักเต็มที่</p><button class="full" id="markRest">บันทึกวันพักแล้ว ✓</button><div class="small" style="margin-top:8px">${(state.gymLogs[String(state.day)]||{}).restDone?"บันทึกวันพักแล้ว":""}</div>`);
}
html+=panel("เครื่องที่ใช้ในโปรแกรม (5 ชนิด)",`<div class="listrow"><span><b>ลู่วิ่ง</b><div class="small">วอร์มอัป/คาร์ดิโอ</div></span><span>5–10 นาที</span></div><div class="listrow"><span><b>Leg Press</b><div class="small">ต้นขาและก้น</div></span><span>2–3 × 10–12</span></div><div class="listrow"><span><b>Chest Press</b><div class="small">อกและแขน</div></span><span>2–3 × 10–12</span></div><div class="listrow"><span><b>Lat Pulldown</b><div class="small">หลังและแขน</div></span><span>2–3 × 10–12</span></div><div class="listrow"><span><b>Seated Leg Curl</b><div class="small">ต้นขาด้านหลัง</div></span><span>2–3 × 10–12</span></div><p class="small">ก่อนเริ่ม ขอให้พนักงานฟิตเนตช่วยปรับเบาะและสอนตั้งเครื่องให้เหมาะกับสรีระ</p>`);
html+=panel("ความคืบหน้าการฝึก",`<div class="row between"><b>${Object.values(state.gymLogs).filter(x=>x.done).length}/12 ครั้ง</b><span class="small">เป้าหมาย 12 เซสชันใน 30 วัน</span></div><div class="bar" style="margin-top:8px"><span style="width:${Math.min(100,Object.values(state.gymLogs).filter(x=>x.done).length/12*100)}%"></span></div><p class="small">เพิ่มน้ำหนักทีละน้อยเมื่อทำครบทุกครั้งได้ด้วยท่าที่ถูกต้องและยังควบคุมได้ ไม่จำเป็นต้องเพิ่มทุกครั้ง</p>`);
html+=panel("เชื่อมกับเมนูอาหาร",`<div class="muted">เปิดแผนอาหาร 30 วันเพื่อดูมื้อเช้า กลางวัน เย็น พร้อมวัตถุดิบและวิธีทำ</div><button class="full" id="openMealPlanGym">เปิดเมนูอาหาร 30 วัน 🍱</button>`);
html+=panel("ความปลอดภัย",`<div class="notice">โปรแกรมนี้เป็นแนวทางสำหรับผู้เริ่มต้น ใช้เครื่องด้วยน้ำหนักเบาในช่วงแรก และขอให้ผู้ฝึกสอนช่วยดูท่า หากยังมีอาการหลังผ่าคลอด ปวด/หน่วงท้อง หรือมีข้อจำกัดสุขภาพ ควรปรึกษาแพทย์ก่อนฝึกแรงต้าน</div>`);
}

else{html+=`<div><h2 style="margin:0 0 4px">ชาเลนจ์ 30 วัน 🗓️</h2><div class="muted">ภารกิจเล็ก ๆ สร้างนิสัยที่ทำต่อได้จริง</div></div>`;html+=panel("ความสำเร็จ",`<div class="row between"><b>${state.doneDays.length}/30 วัน</b><span class="small">${Math.round(state.doneDays.length/30*100)}%</span></div><div class="bar" style="margin-top:8px"><span style="width:${state.doneDays.length/30*100}%"></span></div>`);html+=panel("เลือกวันที่",`<div class="daygrid">${Array.from({length:30},(_,i)=>i+1).map(d=>`<button data-day="${d}" class="${state.doneDays.includes(d)?"done":""} ${state.day===d?"chosen":""}">${state.doneDays.includes(d)?"✓":d}</button>`).join("")}</div><p class="small">เลือกวันเพื่อเปิดภารกิจในแท็บวันนี้</p>`);html+=panel("ภารกิจรายสัปดาห์",Array.from({length:5},(_,w)=>`<div class="listrow"><div><b>สัปดาห์ ${w+1}</b><div class="small">${w===0?"เริ่มจากน้ำและการบันทึก":w===1?"จัดจานและปรับเครื่องดื่ม":w===2?"เพิ่มการเดินและการเคลื่อนไหว":w===3?"ฝึกกล้ามเนื้อตามความพร้อม":"ทบทวนสิ่งที่ได้ผลและวางแผนต่อ"}</div></div></div>`).join(""))}
$("view").innerHTML=html;wire();renderHeader()}

function gymSessionForDay(day){let idx=gymDays.indexOf(Number(day));if(idx<0)return null;let session=gymSessions[idx%3];return {...session,sessionNo:idx+1};}
function exerciseHint(){return {"เดินเร็ว":"เริ่มจากเดินสบาย ๆ แล้วเพิ่มความเร็วเท่าที่พูดเป็นประโยคได้","เต้นเบา ๆ":"เลือกเพลงที่ชอบและเต้นตามจังหวะที่ไม่ทำให้เจ็บ","เวทเบา ๆ":"ลองลุกนั่งจากเก้าอี้ วิดพื้นกับผนัง และยกแขนเบา ๆ","ยืดเหยียด":"เคลื่อนไหวช้า ๆ โดยไม่ฝืนช่วงการเคลื่อนไหว","พัก":"พักผ่อนและทำกิจวัตรประจำวันตามปกติ"}[state.exercise]}
function wire(){
const by=(id,fn)=>{let e=$(id);if(e)e.addEventListener("click",fn)};
by("openMealPlan",()=>{location.href="เมนูอาหาร_ลดน้ำหนัก_30วัน.html"});
by("saveWeight",()=>{let w=Number($("weight").value),wa=Number($("waist").value);if(!(w>=20&&w<=300&&wa>=20&&wa<=300)){ $("saveMessage").textContent="กรุณากรอกน้ำหนักและรอบเอวให้ถูกต้อง";return}state.weight=w;state.waist=wa;state.logs=state.logs.filter(x=>x.day!==state.day);state.logs.push({day:state.day,weight:w,waist:wa});state.logs.sort((a,b)=>a.day-b.day);save();$("saveMessage").textContent="บันทึกข้อมูลแล้ว ✓";$("saveMessage").className="success";});
by("completeTask",()=>{state.doneDays=state.doneDays.includes(state.day)?state.doneDays.filter(d=>d!==state.day):[...state.doneDays,state.day];save();render()});
by("waterPlus",()=>{state.water=Math.min(20,state.water+1);save();render()});by("waterMinus",()=>{state.water=Math.max(0,state.water-1);save();render()});
by("prevDay",()=>{state.day=Math.max(1,state.day-1);save();render()});by("nextDay",()=>{state.day=Math.min(30,state.day+1);save();render()});
document.querySelectorAll("[data-check]").forEach(e=>e.addEventListener("change",()=>{state.checks[Number(e.dataset.check)]=e.checked;save();render()}));
document.querySelectorAll("[data-mode]").forEach(e=>e.addEventListener("click",()=>{state.mealMode=e.dataset.mode;state.mealChoice=menus[state.mealMode][0][0];save();render()}));
document.querySelectorAll("[data-meal]").forEach(e=>e.addEventListener("click",()=>{state.mealChoice=e.dataset.meal;save();render()}));
let act=$("activity");if(act)act.addEventListener("change",()=>{state.exercise=act.value;save();render()});let mins=$("minutes");if(mins)mins.addEventListener("input",()=>{$("minsLabel").textContent=mins.value;state.minutes=Number(mins.value);save()});
by("saveExercise",()=>{state.exerciseDone=!state.exerciseDone;save();render()});
by("openMealPlanGym",()=>{location.href="เมนูอาหาร_ลดน้ำหนัก_30วัน.html"});
document.querySelectorAll("[data-gymday]").forEach(e=>e.addEventListener("click",()=>{state.day=Number(e.dataset.gymday);save();render()}));
by("markRest",()=>{let l=state.gymLogs[String(state.day)]||{items:{}};l.restDone=!l.restDone;state.gymLogs[String(state.day)]=l;save();render()});
by("saveGym",()=>{let plan=gymSessionForDay(state.day);if(!plan)return;let old=state.gymLogs[String(state.day)]||{items:{}};let items={...old.items};plan.exercises.forEach((ex,i)=>{let weight=document.querySelector(`[data-gymweight="${i}"]`),reps=document.querySelector(`[data-gymreps="${i}"]`),check=document.querySelector(`[data-gymcheck="${i}"]`);items[i]={weight:weight?.value||"",reps:reps?.value||"",done:!!check?.checked}});state.gymLogs[String(state.day)]={...old,items,notes:$("gymNotes")?.value||"",done:!!$("gymDone")?.checked};save();$("gymSavedMsg").textContent="บันทึกการฝึกแล้ว ✓";$("gymSavedMsg").className="success";render()});
document.querySelectorAll("[data-day]").forEach(e=>e.addEventListener("click",()=>{state.day=Number(e.dataset.day);save();tab="today";render()}));
by("exportHistory",()=>downloadText("fit-me-history.txt",state.logs.map(l=>`วันที่ ${l.day}: ${l.weight} กก., รอบเอว ${l.waist} ซม.`).join("\n")));
}
function downloadText(name,text){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;render()}));
$("exportBtn").addEventListener("click",()=>downloadText("fit-me-backup.json",JSON.stringify(state,null,2)));
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
